name: Validate Home Assistant app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository and app manifests
        run: |
          python -m json.tool repository.yaml >/dev/null
          python -m json.tool mychargenet_edge/config.yaml >/dev/null
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 and Raspberry Pi images
        uses: docker/build-push-action@v6
        with:
          context: mychargenet_edge
          file: mychargenet_edge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
